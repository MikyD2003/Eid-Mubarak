<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eid Mubarak — Futuristic</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --glass-bg: rgba(255, 255, 255, 0.05);
      --glass-border: rgba(255, 255, 255, 0.18);
      --glass-glow: rgba(0, 255, 255, 0.15);
      --accent: #00e5ff;
      --accent-soft: rgba(0, 229, 255, 0.3);
      --gold: #ffd700;
      --gold-soft: rgba(255, 215, 0, 0.2);
      --rose: #ff6b9d;
      --rose-soft: rgba(255, 107, 157, 0.2);
      --text-primary: #ffffff;
      --text-secondary: rgba(255, 255, 255, 0.6);
    }

    body {
      min-height: 100vh;
      background: #050510;
      font-family: 'Rajdhani', sans-serif;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: crosshair;
    }

    /* ===== ANIMATED BACKGROUND ===== */
    .nebula {
      position: fixed;
      inset: 0;
      z-index: 0;
      background: 
        radial-gradient(ellipse at 20% 30%, rgba(0, 100, 255, 0.15) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 70%, rgba(255, 107, 157, 0.1) 0%, transparent 50%),
        radial-gradient(ellipse at 50% 50%, rgba(0, 229, 255, 0.05) 0%, transparent 60%);
      animation: nebulaShift 20s ease-in-out infinite;
    }

    @keyframes nebulaShift {
      0%, 100% { transform: scale(1) rotate(0deg); opacity: 0.8; }
      33% { transform: scale(1.1) rotate(2deg); opacity: 1; }
      66% { transform: scale(0.95) rotate(-1deg); opacity: 0.7; }
    }

    .starfield {
      position: fixed;
      inset: 0;
      z-index: 1;
    }

    .star {
      position: absolute;
      background: white;
      border-radius: 50%;
      animation: twinkle var(--duration) ease-in-out infinite;
    }

    @keyframes twinkle {
      0%, 100% { opacity: 0.2; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.2); }
    }

    .shooting-star {
      position: fixed;
      width: 4px;
      height: 4px;
      background: var(--gold);
      border-radius: 50%;
      box-shadow: 0 0 20px var(--gold), 0 0 40px var(--gold-soft);
      z-index: 2;
      animation: shoot linear;
      opacity: 0;
    }

    .shooting-star::after {
      content: '';
      position: absolute;
      top: 50%;
      left: -100px;
      width: 100px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold));
      transform: translateY(-50%);
    }

    @keyframes shoot {
      0% { transform: translateX(0) translateY(0); opacity: 1; }
      100% { transform: translateX(-400px) translateY(300px); opacity: 0; }
    }

    /* ===== CRESCENT MOON ===== */
    .moon-container {
      position: fixed;
      top: 8%;
      right: 12%;
      width: 160px;
      height: 160px;
      z-index: 3;
      animation: moonFloat 6s ease-in-out infinite;
    }

    @keyframes moonFloat {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-15px) rotate(3deg); }
    }

    .moon {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #fff8e1, #ffd700 40%, transparent 70%);
      box-shadow: 
        0 0 80px rgba(255, 215, 0, 0.5),
        0 0 160px rgba(255, 215, 0, 0.2),
        inset -25px -25px 50px rgba(0,0,0,0.3);
      position: relative;
      animation: moonPulse 4s ease-in-out infinite;
    }

    @keyframes moonPulse {
      0%, 100% { box-shadow: 0 0 80px rgba(255, 215, 0, 0.5), 0 0 160px rgba(255, 215, 0, 0.2); }
      50% { box-shadow: 0 0 120px rgba(255, 215, 0, 0.7), 0 0 200px rgba(255, 215, 0, 0.3); }
    }

    .moon::after {
      content: '';
      position: absolute;
      top: -10px;
      left: 28px;
      width: 108%;
      height: 108%;
      border-radius: 50%;
      background: #050510;
      box-shadow: 0 0 40px #050510;
    }

    /* ===== FLOATING PARTICLES ===== */
    .particle {
      position: fixed;
      border-radius: 50%;
      z-index: 2;
      animation: floatUp linear infinite;
    }

    .particle.gold {
      background: var(--gold);
      box-shadow: 0 0 10px var(--gold), 0 0 20px var(--gold-soft);
    }

    .particle.cyan {
      background: var(--accent);
      box-shadow: 0 0 10px var(--accent), 0 0 20px var(--accent-soft);
    }

    .particle.rose {
      background: var(--rose);
      box-shadow: 0 0 10px var(--rose), 0 0 20px var(--rose-soft);
    }

    @keyframes floatUp {
      0% { transform: translateY(100vh) translateX(0) rotate(0deg); opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { transform: translateY(-20vh) translateX(80px) rotate(360deg); opacity: 0; }
    }

    /* ===== MAIN CARD ===== */
    .main-card {
      position: relative;
      z-index: 10;
      width: min(90vw, 720px);
      padding: 60px 50px;
      background: var(--glass-bg);
      backdrop-filter: blur(40px);
      -webkit-backdrop-filter: blur(40px);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      box-shadow: 
        0 8px 32px rgba(0, 0, 0, 0.4),
        0 0 0 1px rgba(255, 255, 255, 0.05) inset,
        0 1px 0 rgba(255, 255, 255, 0.1) inset;
      text-align: center;
      overflow: hidden;
      transform: perspective(1000px) rotateX(0deg) rotateY(0deg);
      transition: transform 0.1s ease-out;
    }

    .main-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
      animation: topGlow 3s ease-in-out infinite;
    }

    @keyframes topGlow {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 1; }
    }

    .main-card::after {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle at 30% 20%, var(--gold-soft), transparent 50%),
                  radial-gradient(circle at 70% 80%, var(--accent-soft), transparent 50%);
      pointer-events: none;
      animation: shimmer 8s ease-in-out infinite;
    }

    @keyframes shimmer {
      0%, 100% { transform: rotate(0deg) scale(1); opacity: 0.5; }
      50% { transform: rotate(180deg) scale(1.1); opacity: 0.8; }
    }

    .content {
      position: relative;
      z-index: 2;
    }

    /* ===== TYPOGRAPHY ANIMATIONS ===== */
    .arabic-text {
      font-family: 'Orbitron', sans-serif;
      font-size: clamp(2.5rem, 8vw, 5rem);
      font-weight: 900;
      background: linear-gradient(135deg, var(--gold), #fff8e1, var(--gold), #ff6b9d, var(--gold));
      background-size: 300% 300%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: goldShift 5s ease infinite;
      letter-spacing: 4px;
      margin-bottom: 10px;
      filter: drop-shadow(0 0 20px rgba(255, 215, 0, 0.3));
      transform: translateY(20px);
      opacity: 0;
      animation: goldShift 5s ease infinite, slideUp 1s ease-out 0.3s forwards;
    }

    @keyframes goldShift {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }

    @keyframes slideUp {
      to { transform: translateY(0); opacity: 1; }
    }

    .divider {
      width: 0;
      height: 2px;
      margin: 24px auto;
      background: linear-gradient(90deg, transparent, var(--accent), var(--gold), var(--accent), transparent);
      border-radius: 2px;
      box-shadow: 0 0 10px var(--accent-soft);
      animation: expandLine 1s ease-out 0.8s forwards;
    }

    @keyframes expandLine {
      to { width: 120px; }
    }

    .headline {
      font-family: 'Orbitron', sans-serif;
      font-size: clamp(1.2rem, 4vw, 2rem);
      font-weight: 700;
      color: var(--text-primary);
      letter-spacing: 8px;
      text-transform: uppercase;
      margin-bottom: 16px;
      text-shadow: 0 0 30px rgba(255, 255, 255, 0.1);
      transform: translateY(20px);
      opacity: 0;
      animation: slideUp 1s ease-out 1.2s forwards;
    }

    .subtext {
      font-size: clamp(1rem, 2.5vw, 1.3rem);
      color: var(--text-secondary);
      font-weight: 300;
      line-height: 1.6;
      max-width: 480px;
      margin: 0 auto 32px;
      transform: translateY(20px);
      opacity: 0;
      animation: slideUp 1s ease-out 1.5s forwards;
    }

    .date-badge {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      padding: 12px 28px;
      background: rgba(0, 229, 255, 0.08);
      border: 1px solid rgba(0, 229, 255, 0.25);
      border-radius: 50px;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.9rem;
      color: var(--accent);
      letter-spacing: 3px;
      box-shadow: 0 0 20px rgba(0, 229, 255, 0.1);
      position: relative;
      overflow: hidden;
      transform: scale(0.8);
      opacity: 0;
      animation: popIn 0.6s ease-out 2s forwards;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .date-badge:hover {
      background: rgba(0, 229, 255, 0.15);
      box-shadow: 0 0 30px rgba(0, 229, 255, 0.2);
      transform: scale(1.05);
    }

    @keyframes popIn {
      to { transform: scale(1); opacity: 1; }
    }

    .date-badge::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent, rgba(0, 229, 255, 0.15), transparent);
      animation: scan 3s linear infinite;
    }

    @keyframes scan {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }

    .pulse-dot {
      width: 8px;
      height: 8px;
      background: var(--accent);
      border-radius: 50%;
      box-shadow: 0 0 10px var(--accent);
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.8); opacity: 0.4; }
    }

    /* ===== GEOMETRIC ORNAMENTS ===== */
    .geometric-ornament {
      position: absolute;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 50%;
      pointer-events: none;
    }

    .geo-1 { 
      top: -80px; left: -80px; width: 240px; height: 240px; 
      animation: rotate 30s linear infinite, breathe 4s ease-in-out infinite;
    }
    .geo-2 { 
      bottom: -80px; right: -80px; width: 240px; height: 240px; 
      animation: rotate 25s linear infinite reverse, breathe 4s ease-in-out infinite 2s;
    }
    .geo-3 { 
      top: 50%; left: -120px; width: 140px; height: 140px; 
      animation: rotate 20s linear infinite, breathe 5s ease-in-out infinite 1s;
      opacity: 0.3;
    }

    @keyframes rotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @keyframes breathe {
      0%, 100% { transform: scale(1) rotate(var(--r, 0deg)); }
      50% { transform: scale(1.05) rotate(var(--r, 0deg)); }
    }

    /* ===== SCANLINES ===== */
    .scanlines {
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(0, 0, 0, 0.03) 2px,
        rgba(0, 0, 0, 0.03) 4px
      );
      pointer-events: none;
      z-index: 100;
    }

    /* ===== CURSOR TRAIL ===== */
    .cursor-trail {
      position: fixed;
      width: 6px;
      height: 6px;
      background: var(--accent);
      border-radius: 50%;
      pointer-events: none;
      z-index: 999;
      box-shadow: 0 0 10px var(--accent), 0 0 20px var(--accent-soft);
      transition: opacity 0.5s ease;
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 600px) {
      .main-card { padding: 40px 24px; }
      .moon-container { width: 100px; height: 100px; top: 5%; right: 8%; }
    }
  </style>
</head>
<body>

  <!-- Background Layers -->
  <div class="nebula"></div>
  <div class="starfield" id="starfield"></div>
  <div id="shootingStars"></div>

  <!-- Crescent Moon -->
  <div class="moon-container">
    <div class="moon"></div>
  </div>

  <!-- Floating Particles -->
  <div id="particles"></div>

  <!-- Scanlines -->
  <div class="scanlines"></div>

  <!-- Main Card -->
  <div class="main-card" id="mainCard">
    <div class="geometric-ornament geo-1"></div>
    <div class="geometric-ornament geo-2"></div>
    <div class="geometric-ornament geo-3"></div>

    <div class="content">
      <div class="arabic-text">عيد مبارك</div>
      <div class="divider"></div>
      <div class="headline">Eid Mubarak</div>
      <p class="subtext">
        May this blessed occasion bring peace, prosperity, and infinite light to your path. 
        The stars align in celebration of your joy.
      </p>
      <div class="date-badge" id="dateBadge">
        <span class="pulse-dot"></span>
        <span>1447 AH / 2026 CE</span>
      </div>
    </div>
  </div>

  <script>
    // ===== STARFIELD =====
    const starfield = document.getElementById('starfield');
    for (let i = 0; i < 200; i++) {
      const star = document.createElement('div');
      star.className = 'star';
      star.style.left = Math.random() * 100 + '%';
      star.style.top = Math.random() * 100 + '%';
      const size = Math.random() * 2.5 + 0.5;
      star.style.width = size + 'px';
      star.style.height = size + 'px';
      star.style.setProperty('--duration', (Math.random() * 3 + 2) + 's');
      star.style.animationDelay = Math.random() * 5 + 's';
      starfield.appendChild(star);
    }

    // ===== SHOOTING STARS =====
    function createShootingStar() {
      const container = document.getElementById('shootingStars');
      const star = document.createElement('div');
      star.className = 'shooting-star';
      star.style.top = Math.random() * 50 + '%';
      star.style.left = (Math.random() * 50 + 50) + '%';
      star.style.animationDuration = (Math.random() * 1 + 1) + 's';
      container.appendChild(star);
      setTimeout(() => star.remove(), 2000);
    }
    setInterval(createShootingStar, 4000);

    // ===== FLOATING PARTICLES =====
    const particleContainer = document.getElementById('particles');
    const colors = ['gold', 'cyan', 'rose'];
    for (let i = 0; i < 30; i++) {
      const p = document.createElement('div');
      p.className = `particle ${colors[Math.floor(Math.random() * colors.length)]}`;
      p.style.left = Math.random() * 100 + '%';
      p.style.animationDuration = (Math.random() * 12 + 8) + 's';
      p.style.animationDelay = Math.random() * 15 + 's';
      p.style.opacity = Math.random() * 0.6 + 0.2;
      const size = Math.random() * 4 + 2;
      p.style.width = size + 'px';
      p.style.height = size + 'px';
      particleContainer.appendChild(p);
    }

    // ===== 3D TILT ON MOUSE MOVE =====
    const card = document.getElementById('mainCard');
    document.addEventListener('mousemove', (e) => {
      const rect = card.getBoundingClientRect();
      const centerX = rect.left + rect.width / 2;
      const centerY = rect.top + rect.height / 2;
      const rotateX = (e.clientY - centerY) / 30;
      const rotateY = (e.clientX - centerX) / 30;
      card.style.transform = `perspective(1000px) rotateX(${-rotateX}deg) rotateY(${rotateY}deg)`;
    });

    document.addEventListener('mouseleave', () => {
      card.style.transform = 'perspective(1000px) rotateX(0deg) rotateY(0deg)';
    });

    // ===== CURSOR TRAIL =====
    const trails = [];
    const maxTrails = 12;
    
    document.addEventListener('mousemove', (e) => {
      const trail = document.createElement('div');
      trail.className = 'cursor-trail';
      trail.style.left = e.clientX + 'px';
      trail.style.top = e.clientY + 'px';
      document.body.appendChild(trail);
      trails.push(trail);
      
      if (trails.length > maxTrails) {
        const old = trails.shift();
        old.style.opacity = '0';
        setTimeout(() => old.remove(), 500);
      }
      
      trails.forEach((t, i) => {
        t.style.opacity = (i / maxTrails) * 0.6;
        t.style.transform = `scale(${i / maxTrails})`;
      });
    });

    // ===== DATE BADGE INTERACTION =====
    const badge = document.getElementById('dateBadge');
    const messages = [
      '1447 AH / 2026 CE',
      'Eid al-Fitr',
      '1 Shawwal 1447',
      'May Allah Accept',
      'Taqabbalallahu Minna Wa Minkum'
    ];
    let msgIndex = 0;
    
    badge.addEventListener('click', () => {
      msgIndex = (msgIndex + 1) % messages.length;
      badge.querySelector('span:last-child').textContent = messages[msgIndex];
      badge.style.transform = 'scale(1.1)';
      setTimeout(() => badge.style.transform = 'scale(1)', 200);
    });

    // ===== GEOMETRIC BREATHE FIX =====
    document.querySelectorAll('.geo-1, .geo-2, .geo-3').forEach(el => {
      const computed = getComputedStyle(el);
      el.style.setProperty('--r', computed.animationName.includes('rotate') ? '0deg' : '0deg');
    });
  </script>

</body>
</html>
